version: 2

project_name: raci

builds:
  - id: raci
    main: ./src
    binary: raci
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitBranch={{.Branch}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing `files` replaces goreleaser's defaults, so the ones worth keeping
    # are repeated. NOTICE is not a default, and Apache 2.0 section 4(d)
    # requires redistributions to carry it.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Writes Casks/raci.rb to raci-sh/homebrew-tap (brew install --cask
# raci-sh/tap/raci). GoReleaser commits straight to the tap's main branch, so
# HOMEBREW_TAP_TOKEN must be a token that may push there (contents: write on
# raci-sh/homebrew-tap, and allowed past the org's PR and signed-commit
# rulesets, as for SteerSpec/homebrew-tap). Without the secret the cask is
# skipped rather than failing the release.
homebrew_casks:
  - name: raci
    repository:
      owner: raci-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/raci-sh/raci-CLI
    description: "RACI for agents: who is Responsible, Accountable, Consulted and Informed, per realm"

# macOS notarisation comes later (no signing secrets yet); see the beads.
